name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type-check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # Falls back to the public Sauce Demo site when the secret is unset.
          BASE_URL: ${{ secrets.BASE_URL }}
          DEFAULT_USER_EMAIL: ${{ secrets.DEFAULT_USER_EMAIL || 'standard_user' }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD || 'secret_sauce' }}
          LOCKED_USER_EMAIL: ${{ secrets.LOCKED_USER_EMAIL || 'locked_out_user' }}
          LOCKED_USER_PASSWORD: ${{ secrets.LOCKED_USER_PASSWORD || 'secret_sauce' }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
